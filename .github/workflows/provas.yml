# ============================================================
#  AS PROVAS RODAM SOZINHAS, EM TODA PR
#
#  A prova da ponte existe há meses, é séria — sobe o `index.js` de verdade
#  contra um Supabase e uma Uazapi de mentira — e só rodava quando alguém
#  lembrava de rodar. Uma prova que depende de memória humana é uma prova que
#  um dia não roda, e o dia em que ela não roda é justamente o dia corrido.
#
#  O que isto muda na prática: a PR que quebrar a fila de envio, a entrada, o
#  webhook ou a mídia aparece VERMELHA no GitHub antes de o Rodrigo mesclar,
#  em vez de aparecer como cliente sem resposta na segunda de manhã.
#
#  NÃO TOCA EM NADA QUE RODA EM PRODUÇÃO. Este arquivo não é lido pela Render,
#  não é lido pela ponte, e não muda uma linha do `index.js`. Ele só manda o
#  GitHub rodar `npm test` — o mesmo comando que já existe no `package.json`.
# ============================================================
name: Provas

on:
  # Toda PR, antes do merge: é aqui que o defeito é barato.
  pull_request:

  # A RODADA DEPOIS DO MERGE SAIU, E O MOTIVO FOI MEDIDO EM 28/09.
  #
  # Ela existia porque duas PRs verdes separadas podem se somar numa `main`
  # vermelha — o que é verdade, e continua sendo. O que ficou claro é o PREÇO:
  # ela dobrava o consumo, testando de novo, minutos depois, o mesmo código que
  # a PR tinha acabado de aprovar.
  #
  # Medido: ~29 min por rodada do painel e ~7 desta, duas vezes cada = ~72 min
  # por entrega. A franquia da conta é de 2.000 min/mês, então dava 28
  # entregas. Em 25/09 ela acabou, e as provas PARARAM DE RODAR nos dois
  # repositórios por três dias — sem que ninguém percebesse, porque o trabalho
  # falhava em 5 segundos, sem log, com cara de defeito de código.
  #
  # Uma proteção que se desliga sozinha por falta de minutos protege menos do
  # que uma que roda. Com o corte são ~36 min por entrega, ou ~55 entregas.
  #
  # E O RISCO QUE ELA COBRIA NÃO FICOU DESCOBERTO: aqui é uma pessoa mesclando
  # uma PR de cada vez, então a soma de duas PRs é rara — e a rodada semanal
  # abaixo a pega, além de pegar o que a rodada de PR nunca pegaria, que é uma
  # versão nova de dependência quebrando a `main` parada. Neste repositório
  # isso não é hipótese: foi assim que a estreia deste arquivo descobriu que a
  # ponte NÃO SOBE no Node 20 (ver o comentário do `node-version` abaixo), e o
  # `package-lock.json` está no `.gitignore`, então `npm install` traz o que
  # houver no dia.
  schedule:
    - cron: '17 9 * * 1'

  # E à mão, para quando alguém quiser conferir a `main` sem esperar segunda.
  workflow_dispatch:

# Empurrou de novo antes de a rodada anterior terminar? A velha é cancelada.
# Sem isto, três correções seguidas numa PR viram três rodadas na fila, e a
# resposta que interessa (a do último commit) é a que chega por último.
concurrency:
  group: provas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ponte:
    name: Prova da ponte
    # A VERSÃO DO UBUNTU FICA ESCRITA, E NÃO "ubuntu-latest" (19/10).
    #
    # O banco de teste é o Postgres que vem instalado na máquina (ver o passo
    # "Ligar o Postgres da máquina", abaixo), e a versão dele é a do Ubuntu:
    # a 24.04 traz o Postgres 16, o mesmo em que as provas são escritas e
    # rodadas à mão. Com "ubuntu-latest", no dia em que o GitHub trocasse a
    # máquina por uma mais nova, o banco das provas mudaria de versão sozinho,
    # sem ninguém ter pedido — e uma diferença de versão aparece como X
    # vermelho com cara de defeito de código.
    runs-on: ubuntu-24.04
    # O TETO FOI DE 10 PARA 20 MINUTOS EM 27/10, decidido pelo Rodrigo.
    #
    # Quando ele foi escrito a suíte levava uns dois minutos. MEDIDO no passo
    # "Rodar as provas": 6min50s em 22/10 e 8min28s em 27/10 — mais de um
    # minuto e meio em cinco dias, com sete seções novas, e sobrava 1min18s
    # para os 10. Passando do teto, o GitHub corta a rodada no meio, e o X
    # vermelho do corte é igual ao de um defeito. Subir não custa nada: o
    # repositório é público, e o GitHub não cobra os minutos. Vinte minutos
    # ainda derrubam uma prova pendurada sem deixá-la horas de pé. Ao
    # acrescentar prova, continue olhando quanto a suíte já leva.
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          # NODE 22, E A DESCOBERTA É DESTA PRÓPRIA RODADA.
          #
          # A primeira execução deste arquivo pedia a 20, e reprovou em 22
          # segundos — não por causa das provas, mas porque A PONTE NÃO SOBE
          # nessa versão:
          #
          #   uncaughtException: Node.js 20 detected without native WebSocket
          #   support.
          #
          # O `@supabase/supabase-js` de hoje exige WebSocket nativo, que só
          # existe solto a partir da 22. Ou seja: a integração contínua achou,
          # na estreia, exatamente o tipo de coisa que ela existe para achar —
          # e que de outro jeito apareceria na Render, no dia de um deploy.
          #
          # 22 é também a versão em que as 396 conferências foram rodadas à
          # mão antes desta entrega. A rodada confere o que a gente conferiu.
          node-version: '22'

      # `npm install`, e não `npm ci`: o `package-lock.json` está no
      # `.gitignore` deste repositório, e `npm ci` exige um.
      #
      # Isso deixa esta rodada igual ao que a Render faz ao publicar — e é a
      # parte boa: se uma versão nova do `@supabase/supabase-js` quebrar
      # alguma coisa, quem descobre é esta rodada, e não o escritório depois
      # do deploy.
      - name: Instalar as dependências
        run: npm install --no-audit --no-fund

      # UM POSTGRES DE VERDADE, PARA AS SEÇÕES DOS SCRIPTS DE BANCO.
      #
      # Elas provam `create table`, `begin`/`rollback`, travas, gatilhos e
      # regras de acesso — coisas que o Supabase de mentira não tem como ter,
      # porque ele fala PostgREST, que lê e escreve LINHAS. Provar isto contra
      # o falso seria provar o falso.
      #
      # E as seções FALHAM se este banco não estiver aqui (elas conferem `CI`),
      # em vez de se pularem sozinhas em silêncio. Prova que se pula no lugar
      # onde importa é prova que não existe — e este projeto já teve duas.
      #
      # É O POSTGRES QUE JÁ VEM NA MÁQUINA, E NÃO UMA IMAGEM BAIXADA (19/10).
      #
      # Até aqui ele vinha numa imagem (`postgres:16`), baixada a cada rodada.
      # Em 09/10 o Docker Hub recusou o download duas vezes (`toomanyrequests`,
      # o limite de quem baixa sem conta) e a imagem passou a vir do espelho
      # da Amazon. Em 19/10 a Amazon recusou também, duas rodadas seguidas da
      # PR do script 028 (`toomanyrequests: Data limit exceeded`). Nas quatro
      # vezes a PR ficou vermelha SEM RODAR PROVA NENHUMA, em 11 segundos — o
      # X vermelho igual ao de defeito de código.
      #
      # A máquina do GitHub já traz o Postgres instalado e desligado. Ligá-lo
      # não baixa nada, e não há limite de ninguém para esbarrar. É também o
      # mesmo Postgres em que as provas são rodadas à mão: Ubuntu 24.04,
      # versão 16, com a configuração de fábrica do Ubuntu.
      #
      # A senha é posta aqui porque, pela rede (`127.0.0.1`), o Ubuntu pede
      # senha a todo mundo; pela porta local, `sudo -u postgres` entra sem
      # ela. A última linha escreve a versão no registro da rodada: se um dia
      # uma prova de banco reprovar sem explicação, é a primeira coisa a olhar.
      - name: Ligar o Postgres da máquina
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -p 5432 && break; sleep 1; done
          pg_isready -h 127.0.0.1 -p 5432
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -c "alter user postgres password 'prova'"
          sudo -u postgres psql -At -c "select version()"

      - name: Rodar as provas
        run: npm test
        env:
          # O endereço do Postgres ligado no passo acima. A prova cria um banco
          # novo por conferência, para uma não sujar a outra.
          PROVA_DATABASE_URL: postgresql://postgres:prova@127.0.0.1:5432/postgres
